services:
  web:
    build: .
    image: bookreader:local
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DATABASE_URL: "sqlite:///app/data/bookreader.db?mode=rwc"
      LEPTOS_SITE_ADDR: "0.0.0.0:3000"
      LEPTOS_OUTPUT_NAME: bookreader
      LEPTOS_SITE_ROOT: target/site
      UPLOAD_DIR: /app/storage
      RUST_LOG: "${RUST_LOG:-info,tower_http=debug}"
    volumes:
      - database:/app/data
      - uploads:/app/storage
      - ./content/slides:/app/content/slides:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  database:
  uploads:
